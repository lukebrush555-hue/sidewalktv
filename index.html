<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; overflow-x: hidden; }

  body {
    font-family: 'Outfit', sans-serif;
    background: #fef5ed;
    color: #1a1a1a;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── NAV ── */
  .nav {
    width: 100%;
    padding: 16px 24px;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
    background: #fef5ed;
    transition: box-shadow 0.3s ease;
  }

  .nav.scrolled {
    box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
  }

  .nav-brand {
    font-size: 20px;
    font-weight: 800;
    color: #1a1a1a;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .nav-brand img {
    width: 36px;
    height: 36px;
    border-radius: 8px;
  }

  .nav-brand span.nav-text {
    color: #1a1a1a;
  }

  .nav-brand span {
    color: #0096FF;
  }

  /* ── HERO ── */
  .hero {
    text-align: center;
    padding: 10px 24px 6px;
    max-width: 600px;
    margin: 0 auto;
  }

  .hero h1 {
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.03em;
    margin-bottom: 12px;
    color: #1a1a1a;
  }

  .hero h1 span {
    color: #0096FF;
  }

  .hero p {
    font-size: 16px;
    color: #888;
    font-weight: 400;
    line-height: 1.5;
  }

  /* ── CAROUSEL ── */
  .carousel-wrapper {
    width: 100%;
    padding: 24px 0;
    overflow: hidden;
    position: relative;
  }

  .carousel-track {
    display: flex;
    gap: 16px;
    animation: scroll 30s linear infinite;
    animation-play-state: paused;
    width: max-content;
  }

  .carousel-track.running {
    animation-play-state: running;
  }

  .carousel-track.running:hover {
    animation-play-state: paused;
  }

  @keyframes scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  .carousel-item {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 180px;
  }

  .card-frame {
    width: 170px;
    height: 310px;
    border-radius: 24px;
    border: 5px solid #1a1a1a;
    overflow: hidden;
    background: #e5e5e5;
    position: relative;
    transition: transform 0.3s ease;
    cursor: pointer;
  }

  .card-frame:hover {
    transform: scale(1.03);
  }

  .card-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .card-caption {
    margin-top: 10px;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    line-height: 1.2;
    color: #1a1a1a;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── CTA ── */
  .cta-section {
    text-align: center;
    padding: 14px 24px 40px;
  }

  .cta-free {
    font-size: 22px;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 20px;
    letter-spacing: -0.01em;
  }

  .cta-free span {
    color: #888;
    font-weight: 400;
  }

  .cta-button {
    display: inline-block;
    background: #BB3DFB;
    color: #ffffff;
    font-family: 'Outfit', sans-serif;
    font-size: 20px;
    font-weight: 700;
    padding: 20px 64px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s ease;
    box-shadow: 0 4px 20px rgba(187, 61, 251, 0.35);
  }

  .cta-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 28px rgba(187, 61, 251, 0.45);
  }

  .cta-button:active {
    transform: translateY(0);
  }

  .cta-sub {
    margin-top: 16px;
    font-size: 13px;
    color: #aaa;
  }

  /* ── MOBILE FIXES ── */
  @media (max-width: 767px) {
    .page-wrapper {
      overflow-x: hidden;
    }

    .nav {
      justify-content: center;
      padding: 12px 16px;
    }

    .hero {
      padding: 8px 16px 6px;
    }

    .hero h1 {
      font-size: clamp(26px, 6.5vw, 42px);
      line-height: 1.2;
    }

    .hero p {
      font-size: 9px;
      padding: 0 8px;
    }

    .cta-section {
      padding: 14px 16px 32px;
    }

    .cta-free {
      font-size: 18px;
    }

    .cta-button {
      font-size: 21px;
      padding: 22px 84px;
    }
  }

  /* ── DESKTOP ENHANCEMENTS ── */
  @media (min-width: 768px) {
    .nav { padding: 20px 40px; }

    .hero { padding: 20px 40px 12px; }

    .carousel-item { width: 220px; }

    .card-frame {
      width: 200px;
      height: 360px;
    }

    .card-caption { font-size: 16px; }

    .cta-section { padding: 20px 40px 60px; }
  }

  @media (min-width: 1024px) {
    body {
      justify-content: center;
      min-height: 100vh;
    }

    .page-wrapper {
      max-width: 1200px;
      width: 100%;
    }

    .carousel-item { width: 240px; }

    .card-frame {
      width: 220px;
      height: 400px;
      border-radius: 28px;
    }

    .card-caption { font-size: 21px; }
  }

  /* ── FADE IN ── */
  .fade-up {
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 0.6s ease forwards;
  }

  .fade-up-delay-1 { animation-delay: 0.15s; }
  .fade-up-delay-2 { animation-delay: 0.3s; }
  .fade-up-delay-3 { animation-delay: 0.5s; }

  @keyframes fadeUp {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>

      image: 'https://storage.googleapis.com/flutterflow-io-6f20.appspot.com/projects/tok-flow-01-h-e6-d7-x-w65-a-y-c4-q-y-s49-q-k-b-g8-e-49jj7l/assets/vcmbpsimknfp/Blue_Modern_Minimalist_Fashion_Coming_Soon_Instagram_Story-11.gif',
      caption: 'No fluff.\nJust data.'
    },
    {
      image: 'https://storage.googleapis.com/flutterflow-io-6f20.appspot.com/projects/tok-flow-01-h-e6-d7-x-w65-a-y-c4-q-y-s49-q-k-b-g8-e-49jj7l/assets/8c3howvtata2/Blue_Modern_Minimalist_Fashion_Coming_Soon_Instagram_Story-6.png',
      caption: 'Costs.\nSuppliers.\nAll of it.'
    },
  ];

  const track = document.getElementById('carouselTrack');

  function buildItems(itemList) {
    return itemList.map(item => {
      const caption = item.caption.replace(/\n/g, '<br>');
      return `
        <div class="carousel-item">
          <div class="card-frame">
            <img src="${item.image}" alt="${item.caption.replace(/\n/g, ' ')}" loading="lazy">
          </div>
          <div class="card-caption">${caption}</div>
        </div>
      `;
    }).join('');
  }

  // Duplicate 3x for seamless loop
  track.innerHTML = buildItems(items) + buildItems(items) + buildItems(items);

  const itemWidth = window.innerWidth >= 1024 ? 256 : window.innerWidth >= 768 ? 236 : 196;
  const totalWidth = items.length * itemWidth;
  const speed = 40; // pixels per second
  const duration = totalWidth / speed;

  track.style.animationDuration = `${duration}s`;

  // Let the user read the headline, then start the carousel
  setTimeout(() => {
    track.classList.add('running');
  }, 2000);

  var btn = document.getElementById("storeButton");
  btn.addEventListener("click", function(e) {
    e.preventDefault();
    var ua = navigator.userAgent.toLowerCase();
    if (ua.indexOf("android") > -1) {
      window.location.href = "https://play.google.com/store/apps/details?id=com.sidewalkcoffeeshops";
    } else {
      window.location.href = "https://apps.apple.com/us/app/sidewalk-coffee-shops/id6472616630";
    }
  });
</script>

</body>
</html>
